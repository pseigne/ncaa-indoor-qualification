name: Update portfolio deployment
on:
  workflow_run:
    workflows: [Daily TFRRS Scraper]
    types: [completed]
permissions:
  contents: read
concurrency:
  group: portfolio-source-update
  cancel-in-progress: false
jobs:
  notify:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.head_branch == 'main' &&
      github.event.workflow_run.head_repository.full_name == github.repository &&
      (github.event.workflow_run.event == 'schedule' ||
       github.event.workflow_run.event == 'workflow_dispatch' ||
       github.event.workflow_run.event == 'push')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          repository: pseigne/website
          ssh-key: ${{ secrets.PORTFOLIO_DEPLOY_KEY }}
          path: portfolio
      - name: Publish source update trigger
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          source_sha=$(gh api repos/${{ github.repository }}/commits/main --jq .sha)
          cd portfolio
          mkdir -p .deploy/triggers
          jq -n --arg commit "$source_sha" '{commit: $commit}' > .deploy/triggers/ncaa-indoor-qualification.json
          git config user.name 'Portfolio Deploy'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add .deploy/triggers/ncaa-indoor-qualification.json
          if git diff --cached --quiet; then exit 0; fi
          git commit -m 'Update ncaa-indoor-qualification source'
          for attempt in 1 2 3; do
            git pull --rebase origin main
            if git push origin main; then exit 0; fi
          done
          exit 1
